<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #0b0c10; }
  #root { position: absolute; inset: 0; background: radial-gradient(circle at 20% 12%, #FFD23F22, transparent 45%), #0b0c10; font-family: Montserrat; color: #fff; overflow: hidden; }
  #paper { position: absolute; inset: 0; }
  .n { position: absolute; left: 64px; top: 170px; font-size: 230px; font-weight: 900; color: #FFD23F; line-height: .9; letter-spacing: -0.04em; }
  .kick { position: absolute; left: 70px; top: 400px; font-size: 32px; font-weight: 700; color: #FFD23F; letter-spacing: .14em; text-transform: uppercase; }
  .title { position: absolute; left: 64px; top: 600px; font-size: 112px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; }
  .sub { position: absolute; left: 66px; top: 735px; font-size: 46px; font-weight: 700; color: rgba(255,255,255,.75); }
  .rows { position: absolute; left: 64px; right: 64px; top: 840px; display: flex; flex-direction: column; gap: 26px; }
  .row { display: flex; align-items: center; gap: 26px; height: 104px; border: 3px dashed rgba(255,255,255,.18); border-radius: 22px; padding: 0 24px; }
  .tag { background: #FFD23F; color: #0b0c10; border-radius: 14px; padding: 12px 20px; font-size: 34px; font-weight: 900; text-transform: uppercase; width: 150px; text-align: center; }
  .txt { font-size: 50px; font-weight: 700; }
  .chips { position: absolute; left: 64px; right: 64px; top: 1260px; display: flex; gap: 20px; flex-wrap: wrap; }
  .chip { border: 3px solid #FFD23F; color: #FFD23F; border-radius: 40px; padding: 14px 28px; font-size: 40px; font-weight: 700; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="12.05" data-width="1080" data-height="1920">
  <div id="paper" class="clip" data-start="0" data-duration="12.05" data-track-index="0">
    <div class="n">03</div>
    <div class="kick">Technique 3 of 15</div>
    <div class="title">Few-shot</div>
    <div class="sub">Many examples, many formats.</div>
    <div class="rows">
      <div class="row"><div class="tag" id="t1">Ex 1</div><div class="txt" id="row1">Email format</div></div>
      <div class="row"><div class="tag" id="t2">Ex 2</div><div class="txt" id="row2">Article format</div></div>
      <div class="row"><div class="tag" id="t3">Ex 3</div><div class="txt" id="row3">Blog post format</div></div>
    </div>
    <div class="chips"><div class="chip" id="chip1">Consistent formatting</div><div class="chip" id="chip2">Content at scale</div></div>
  </div>
</div>
<script src="gsap.min.js"></script>
<script src="sync.js"></script>
<script>
  // every element lands on the word that names it (sync.js, written by compile.mjs); nothing moves after it lands
  const at = (sel) => window.__sync[sel];
  const tl = gsap.timeline({ paused: true });
  ["#t1", "#t2", "#t3"].forEach((t, i) => tl.fromTo(t, { opacity: 0.25 }, { opacity: 1, duration: 0.2 }, at("#row" + (i + 1))));
  ["#row1", "#row2", "#row3"].forEach((r) => tl.fromTo(r, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, at(r)));
  ["#chip1", "#chip2"].forEach((c) => tl.fromTo(c, { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, at(c)));
  tl.set({}, {}, 12.05);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
